<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scheda Palestra">

<!-- Icone e Web App Manifest -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<title>Scheda Palestra</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}
main{max-width:520px;margin:auto;padding:18px 16px 28px}
h1{font-size:27px;margin:4px 0 4px}.sub{color:#6b7280;margin-bottom:18px}
.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.today{border:2px solid #111827}.today small{font-weight:700;text-transform:uppercase}
button{width:100%;min-height:52px;border:0;border-radius:14px;background:#111827;color:white;font-size:16px;font-weight:700;margin-top:12px;cursor:pointer}
.day{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #eee}
.day:first-child{border-top:0}.dot{width:10px;height:10px;border-radius:50%;background:#9ca3af}.active .dot{background:#111827}
.day b{min-width:42px}.day span{flex:1}.open{width:auto;min-height:40px;padding:8px 13px;margin:0;font-size:14px}
#viewer{display:none;position:fixed;inset:0;background:#111827;z-index:5}
#viewer iframe{width:100%;height:100%;border:0}
.toolbar{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;z-index:6;padding:8px;background:rgba(17,24,39,.94);display:flex;gap:8px}
.toolbar button{margin:0;width:auto;min-height:42px;padding:8px 14px}
.toolbar .title{color:white;display:flex;align-items:center;justify-content:center;flex:1;font-weight:700}
</style>
</head>
<body>
<main>
<h1>🏋️ Scheda Palestra</h1>
<div class="sub" id="date"></div>

<section class="card today">
<small>Allenamento di oggi</small>
<h2 id="todayTitle" style="margin:7px 0 0"></h2>
<div id="todayDesc" class="sub" style="margin:4px 0 0"></div>
<button id="todayBtn" type="button">Apri allenamento</button>
</section>

<section class="card">
<h2 style="margin-top:0">Settimana</h2>
<div id="week"></div>
</section>
</main>

<div id="viewer">
  <div class="toolbar">
    <button id="close" type="button">← Home</button>
    <div class="title" id="viewerTitle"></div>
  </div>
  <iframe id="pdf"></iframe>
</div>

<script>
// Registrazione del Service Worker per la PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

const days = [
 {dow:1, name:"Lunedì", day:"Giorno 1", desc:"Petto / Spalle / Tricipiti / Core", file:"giorno1.pdf"},
 {dow:2, name:"Martedì", day:"Giorno 2", desc:"Schiena / Deltoidi posteriori / Bicipiti / Addominali", file:"giorno2.pdf"},
 {dow:3, name:"Mercoledì", day:"Riposo", desc:"Nessun allenamento programmato", file:null},
 {dow:4, name:"Giovedì", day:"Giorno 3", desc:"Mix gambe / Addominali", file:"giorno3.pdf"},
 {dow:5, name:"Venerdì", day:"Giorno 4", desc:"Mix parte superiore", file:"giorno4.pdf"},
 {dow:6, name:"Sabato", day:"Riposo", desc:"Nessun allenamento programmato", file:null},
 {dow:0, name:"Domenica", day:"Riposo", desc:"Nessun allenamento programmato", file:null}
];

const now = new Date();
const today = now.getDay();
const d = days.find(x=>x.dow===today);

document.getElementById("date").textContent =
  now.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});

document.getElementById("todayTitle").textContent = d.day;
document.getElementById("todayDesc").textContent = d.desc;

const todayBtn = document.getElementById("todayBtn");
if (!d.file) {
  todayBtn.textContent = "Vedi scheda completa";
  todayBtn.addEventListener("click", () => openPdfFile("scheda_allenamento.pdf", "Scheda Completa"));
} else {
  todayBtn.textContent = "Apri allenamento";
  todayBtn.addEventListener("click", () => openPdfFile(d.file, d.day));
}

function openPdfFile(filePath, title){
  const viewer = document.getElementById("viewer");
  document.getElementById("viewerTitle").textContent = title;
  document.getElementById("pdf").src = filePath;
  viewer.style.display = "block";
}

document.getElementById("close").addEventListener("click", () => {
  document.getElementById("pdf").src = "";
  document.getElementById("viewer").style.display = "none";
});

const week = document.getElementById("week");
days.forEach(item => {
 const row = document.createElement("div");
 row.className = "day" + (item.dow === today ? " active" : "");
 row.innerHTML = `<div class="dot"></div><b>${item.name.slice(0,3).toUpperCase()}</b><span><strong>${item.day}</strong><br><small>${item.desc}</small></span>`;
 if(item.file){
   const b = document.createElement("button");
   b.className = "open"; b.type = "button"; b.textContent = "Apri";
   b.addEventListener("click", () => openPdfFile(item.file, item.day));
   row.appendChild(b);
 }
 week.appendChild(row);
});
</script>
</body>
</html>
